project:
  type: default
  output-dir: ./docs
  resources:
    - docs/images/

# Render all .qmd files in content/resources/
# Renders to output-dir root (flattened structure)
render:
  - content/*.qmd

# Default format settings for all documents
format:
  html:
    theme: default
    toc: false
    embed-resources: true
    css: docs/css/style.css
    include-before-body: _extensions/header.html
    include-after-body: _extensions/footer.html
    
  pdf:
    toc: false
    colorlinks: true
    fontsize: 11pt

# Execution settings
execute:
  freeze: auto

# Copy images to output
